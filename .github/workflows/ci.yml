name: CI

on:
    pull_request:

    push:
        branches: [main]
        paths:
            - "domains/*"
            - "tests/*"
            - "json/*"
            - ".github/workflows/ci.yml"
            - ".github/PULL_REQUEST_TEMPLATE"
            - "package.json"
            - "package-lock.json"

    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.ref }}-ci

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - run: npm ci

            - name: Fetch PR information
              if: github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> "$GITHUB_ENV"
                  echo "PR_AUTHOR_ID=${{ github.event.pull_request.user.id }}" >> "$GITHUB_ENV"
                  echo "PR_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
                  echo "PR_LABELS=$(gh pr view ${{ github.event.pull_request.number }} --json labels --jq '[.labels[].name]')" >> "$GITHUB_ENV"
                  echo "CHANGED_FILES=$(gh api --jq '[.[] | select(.status != "removed") | .filename]' "repos/${{ github.repository }}/pulls/$PR/files")" >> "$GITHUB_ENV"
                  echo "DELETED_FILES=$(gh api --jq '[.[] | select(.status == "removed") | {name: .filename, data: .patch}]' "repos/${{ github.repository }}/pulls/$PR/files")" >> "$GITHUB_ENV"

            - name: Check pull request template
              if: github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  if jq -e 'index("ci: bypass-template-check") != null' <<< "$PR_LABELS" >/dev/null; then
                      echo "Template check bypassed by label."
                      exit 0
                  fi

                  template=$(gh api "repos/$REPOSITORY/contents/.github/PULL_REQUEST_TEMPLATE?ref=$PR_BASE_SHA" --jq .content | base64 --decode)
                  body=$(gh api "repos/$REPOSITORY/pulls/$PR" --jq '.body // ""')
                  body=$(sed 's/[[:space:]]*$//' <<< "$body")
                  mapfile -t items < <(sed -nE 's/^[[:space:]]*-[[:space:]]+\[[ xX]\][[:space:]]+(.+)$/\1/p' <<< "$template" | sed 's/[[:space:]]*$//')

                  if [[ ${#items[@]} -eq 0 ]]; then
                      echo "::error::The base branch pull request template has no checklist items."
                      exit 1
                  fi

                  for item in "${items[@]}"; do
                      if ! grep -Fqx -- "- [x] $item" <<< "$body" && ! grep -Fqx -- "- [X] $item" <<< "$body"; then
                          echo "::error::Complete the pull request checklist item: $item"
                          exit 1
                      fi
                  done

            - name: Run tests
              run: npx ava tests/*.test.js --timeout=1m
